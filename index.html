<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MarketHub - Multi-Vendor Marketplace</title>
    
<!-- Preconnect to Supabase for early hero image discovery -->
    <link rel="preconnect" href="https://bnkyddmmhaaefzfvzpqs.supabase.co" crossorigin />
    
    <!-- Critical hero image preload for LCP - static fallback -->
    <!-- This ensures LCP optimization even before React hydrates -->
    <link rel="preload" as="image" href="https://bnkyddmmhaaefzfvzpqs.supabase.co/storage/v1/object/public/heroes/default-hero.jpg?width=1280&quality=85" fetchpriority="high" />
    
    <!-- Fallback hero image preload (in case admin hasn't configured hero slides) -->
    <script>
      // Preconnect + early fetch for hero image discovery
      // Runs before React hydration to optimize LCP
      (function() {
        var img = new Image();
        img.fetchPriority = 'high';
        img.src = 'https://bnkyddmmhaaefzfvzpqs.supabase.co/storage/v1/object/public/heroes/default-hero.jpg?width=768&quality=85';
      })();
    </script>
    
    <!-- Preconnect to Google Fonts for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link 
      rel="stylesheet" 
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    />
    
    <!-- DNS prefetch for likely external resources -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    
    <meta
      name="description"
      content="Buy and sell with confidence on MarketHub, a multi-vendor marketplace with verified sellers, secure payments, and buyer protection."
    />
    <meta name="author" content="MarketHub" />
    <meta name="google-site-verification" content="TdcsVhd1pfgKWaQR5wG1ZjJUfSyjyAeVSb3Y_V0vJoU" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MarketHub - Multi-Vendor Marketplace" />
    <meta
      property="og:description"
      content="Buy and sell with confidence on MarketHub, a multi-vendor marketplace with verified sellers, secure payments, and buyer protection."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MarketHub - Multi-Vendor Marketplace" />
    <meta
      name="twitter:description"
      content="Buy and sell with confidence on MarketHub, a multi-vendor marketplace with verified sellers, secure payments, and buyer protection."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#111111" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://markethub.com/" />
    
    <!-- Performance & Security -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-TileColor" content="#111111" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    
    <!-- Additional SEO -->
    <meta name="keywords" content="marketplace, multi-vendor, e-commerce, online shopping, verified sellers, secure payments, buyer protection" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    
    <!-- Open Graph / Social Sharing -->
    <meta property="og:url" content="https://markethub.com/" />
    <meta property="og:site_name" content="MarketHub" />
    <meta property="og:image" content="https://markethub.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MarketHub - Multi-Vendor Marketplace" />
    
    <!-- Twitter Card -->
    <meta name="twitter:image" content="https://markethub.com/og-image.jpg" />
    <meta name="twitter:image:alt" content="MarketHub - Multi-Vendor Marketplace" />
    
    <!-- Structured Data / Schema.org -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "MarketHub",
      "url": "https://markethub.com/",
      "description": "Multi-vendor marketplace with verified sellers, secure payments, and buyer protection",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://markethub.com/marketplace?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
