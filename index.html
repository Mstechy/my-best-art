<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Critical shell styles prevent the browser's default body margin from
         showing during the first paint before the Vite stylesheet is ready. -->
    <style>
      html, body, #root { width: 100%; min-height: 100%; min-width: 0; }
      html, body { overflow-x: clip; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
      body { margin: 0; }
      *, *::before, *::after { box-sizing: border-box; }
    </style>
    <meta name="google-site-verification" content="89XTJNqWIy_z32sTfKF8xTzfMffRswBFJPceIi4NVFM" />
    <title>Tradibu | Online Marketplace for Trusted Shopping</title>
    
<!-- The home hero is the Largest Contentful Paint element, and it is preloaded
         as a STATIC link on purpose. The preload scanner reads raw HTML and only
         sees <link rel="preload"> elements. Building the same link from an inline
         <script> meant the image could not be requested until the HTML was parsed
         and that script had been downloaded and executed - three requests before
         the LCP image even started, which is exactly what Lighthouse flagged as
         "the LCP image request is not initiated by the HTML document".

         imagesrcset/imagesizes mirror the <picture> in HeroSlider so the browser
         picks the same candidate the <img> will ask for: the 960w file on phones,
         the 1600w one above 640px. If they disagree the preload is discarded as a
         mismatch and the whole thing is wasted, so the two must stay in step. -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/images/electronics-products-1600x686.webp"
      imagesrcset="/images/electronics-products-960x540.webp 960w, /images/electronics-products-1600x686.webp 1600w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <!-- Preconnect to Supabase for API data used by the marketplace. The REST
         calls go out with fetch(), which is a CORS request, so the connection
         must be opened in CORS mode or it cannot be reused. Without
         crossorigin the socket is opened anonymously, the API call opens a
         second one, and the hint is wasted. -->
    <link rel="preconnect" href="https://bnkyddmmhaaefzfvzpqs.supabase.co" crossorigin="anonymous" />
    
    <!-- Preconnect to Google Fonts for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Inter 800 is REQUIRED: the Tradibu design uses font-weight:800 for the
      logo, hero h1, section headings, price and badges. Without it the browser
      synthesises a faux-bold that looks smeared on high-DPI screens.
      900 is included for the logo wordmark.
    -->
    <link 
      rel="stylesheet" 
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link 
        rel="stylesheet" 
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap"
      />
    </noscript>
    
    <!-- DNS prefetch for likely external resources -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    
    <meta
      name="description"
      content="Buy and sell with confidence on Tradibu, a multi-vendor marketplace with verified sellers, secure payments, and buyer protection."
    />
    <meta name="author" content="Tradibu" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tradibu - Multi-Vendor Marketplace" />
    <meta
      property="og:description"
      content="Buy and sell with confidence on Tradibu, a multi-vendor marketplace with verified sellers, secure payments, and buyer protection."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tradibu - Multi-Vendor Marketplace" />
    <meta
      name="twitter:description"
      content="Buy and sell with confidence on Tradibu, a multi-vendor marketplace with verified sellers, secure payments, and buyer protection."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#111111" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://www.tradibu.com/" />
    
    <!-- Performance & Security -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-TileColor" content="#111111" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    
    <!-- Additional SEO -->
    <meta name="keywords" content="marketplace, multi-vendor, e-commerce, online shopping, verified sellers, secure payments, buyer protection" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- Agent discovery. The rel token must be exactly "ai-catalog": that is what an
         agent (and Lighthouse's Agentic browsing audits) looks for, and "alternate"
         is ignored. /llms.txt is the plain-text briefing. -->
    <link rel="alternate ai-catalog" type="application/ai-catalog+json" title="Tradibu AI catalog" href="/ai-catalog.json" />
    
    <!-- Open Graph / Social Sharing -->
    <meta property="og:url" content="https://www.tradibu.com/" />
    <meta property="og:site_name" content="Tradibu" />
    <meta property="og:image" content="https://www.tradibu.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tradibu - Multi-Vendor Marketplace" />
    
    <!-- Twitter Card -->
    <meta name="twitter:image" content="https://www.tradibu.com/og-image.jpg" />
    <meta name="twitter:image:alt" content="Tradibu - Multi-Vendor Marketplace" />
    
    <!-- Structured Data / Schema.org -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://www.tradibu.com/#website",
          "name": "Tradibu",
          "url": "https://www.tradibu.com/",
          "description": "Multi-vendor marketplace with verified sellers, secure payments, and buyer protection",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://www.tradibu.com/marketplace?search={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Organization",
          "@id": "https://www.tradibu.com/#organization",
          "name": "Tradibu",
          "url": "https://www.tradibu.com/"
        }
      ]
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
