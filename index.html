<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Preconnect hints FIRST in the head, before any resource the scanner could
         want: a hint only pays off when the parser can start opening the socket
         before anything needs it, and these two origins serve everything
         cross-origin the first screen asks for - the Google Fonts stylesheet (and
         the woff2 files behind it) and the Supabase API. When they sat further down
         the head the field audit still found the fonts.googleapis.com connection
         being created at request time. The Supabase REST calls go out with fetch()
         in CORS mode, so `crossorigin` is required there or the socket opens
         anonymously and the API call opens a second one; the fonts stylesheet is a
         no-cors request and must NOT carry it, while fonts.gstatic.com does because
         the font files themselves are fetched in CORS mode. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://bnkyddmmhaaefzfvzpqs.supabase.co" crossorigin="anonymous" />
    <!-- Critical shell styles prevent the browser's default body margin from
         showing during the first paint before the Vite stylesheet is ready. -->
    <style>
      html, body, #root { width: 100%; min-height: 100%; min-width: 0; }
      html, body { overflow-x: clip; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
      body { margin: 0; }
      *, *::before, *::after { box-sizing: border-box; }
    </style>
    <meta name="google-site-verification" content="89XTJNqWIy_z32sTfKF8xTzfMffRswBFJPceIi4NVFM" />
    <!-- The homepage head is what src/lib/pageSeo.ts publishes as HOME_PAGE_SEO,
         written the way LandingPage renders it after mount rather than the other
         way round: `buildPageTitle` appends the " | Tradibu" suffix, so a crawler
         that executes JavaScript and one that does not now read the same words in
         the same order instead of two orderings of one title.
         src/test/pageSeoHead.test.ts fails if this drifts from the constant. -->
    <title>Online Marketplace for Trusted Shopping | Tradibu</title>
    
<!-- The home hero is the Largest Contentful Paint element, and it is preloaded
         as a STATIC link on purpose. The preload scanner reads raw HTML and only
         sees <link rel="preload"> elements. Building the same link from an inline
         <script> meant the image could not be requested until the HTML was parsed
         and that script had been downloaded and executed - three requests before
         the LCP image even started, which is exactly what Lighthouse flagged as
         "the LCP image request is not initiated by the HTML document".

         Two media-keyed preloads copy the <source> media query verbatim
         ("(max-width: 640px)" / "(min-width: 641px)"), so exactly one may fire. The
         1px seam at (640, 641) holds no device, and its worst case is "no preload"
         rather than the wrong one.

         Inside the mobile band, imagesrcset mirrors the <source> srcset BYTE FOR
         BYTE: density candidates ("...480x270.webp 1x, ...960x540.webp 2x") and no
         sizes attribute, so both sides run the same selection over the same list
         and must resolve to the same file - no viewport arithmetic is left that
         can disagree. This is deliberately NOT width descriptors plus
         imagesizes="100vw": that rule multiplies the viewport by the device pixel
         ratio, so on a high-DPR phone it resolved to a different file than the
         <picture> asked for and produced two downloads neither reused. The href
         attribute stays as the fallback for UAs without imagesrcset support, where
         any >=2x device still lands on the same 960x540 file.

         The 480x270 candidate is what a 1x CSS-pixel viewport downloads: the
         render Lighthouse measured as oversized at 26.6 KB, at about a third of
         the bytes. -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      media="(max-width: 640px)"
      href="/images/electronics-products-960x540.webp"
      imagesrcset="/images/electronics-products-480x270.webp 1x, /images/electronics-products-960x540.webp 2x"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      media="(min-width: 641px)"
      href="/images/electronics-products-1600x686.webp"
      fetchpriority="high"
    />
    <!--
      Inter 800 is REQUIRED: the Tradibu design uses font-weight:800 for the
      logo, hero h1, section headings, price and badges. Without it the browser
      synthesises a faux-bold that looks smeared on high-DPI screens.
      900 is included for the logo wordmark.
    -->
    <link 
      rel="stylesheet" 
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link 
        rel="stylesheet" 
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap"
      />
    </noscript>
    
    
    <meta
      name="description"
      content="Shop on Tradibu, the online marketplace for products from independent sellers. Discover great deals with secure payments and buyer protection."
    />
    <meta name="author" content="Tradibu" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Online Marketplace for Trusted Shopping | Tradibu" />
    <meta
      property="og:description"
      content="Shop on Tradibu, the online marketplace for products from independent sellers. Discover great deals with secure payments and buyer protection."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Online Marketplace for Trusted Shopping | Tradibu" />
    <meta
      name="twitter:description"
      content="Shop on Tradibu, the online marketplace for products from independent sellers. Discover great deals with secure payments and buyer protection."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#111111" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://www.tradibu.com/" />
    
    <!-- Performance & Security -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-TileColor" content="#111111" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    
    <!-- Additional SEO -->
    <meta name="keywords" content="marketplace, multi-vendor, e-commerce, online shopping, verified sellers, secure payments, buyer protection" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- Agent discovery. The rel token must be exactly "ai-catalog": that is what an
         agent (and Lighthouse's Agentic browsing audits) looks for, and "alternate"
         is ignored. /llms.txt is the plain-text briefing. -->
    <link rel="alternate ai-catalog" type="application/ai-catalog+json" title="Tradibu AI catalog" href="/ai-catalog.json" />
    
    <!-- Open Graph / Social Sharing -->
    <meta property="og:url" content="https://www.tradibu.com/" />
    <meta property="og:site_name" content="Tradibu" />
    <meta property="og:image" content="https://www.tradibu.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tradibu - Multi-Vendor Marketplace" />
    
    <!-- Twitter Card -->
    <meta name="twitter:image" content="https://www.tradibu.com/og-image.jpg" />
    <meta name="twitter:image:alt" content="Tradibu - Multi-Vendor Marketplace" />
    
    <!-- Structured Data / Schema.org -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://www.tradibu.com/#website",
          "name": "Tradibu",
          "url": "https://www.tradibu.com/",
          "description": "Multi-vendor marketplace with verified sellers, secure payments, and buyer protection",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://www.tradibu.com/marketplace?search={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Organization",
          "@id": "https://www.tradibu.com/#organization",
          "name": "Tradibu",
          "url": "https://www.tradibu.com/"
        }
      ]
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
