<!DOCTYPE html>
<!--
  REFERENCE SKETCH — NOT PART OF THE BUILD.
  Source: Claude desktop redesign concept — piece 5: CHECKOUT page (checkout.html).
  Concept filename: checkout.html   <title>Checkout — MarketHub</title>

  Design tokens confirmed again (none defined in this repo):
      --line, --line-strong, --muted, --ink, --brand, --brand-dark, --radius-m
  Notable structure: a 4-step progress indicator (1 Address / 2 Shipping /
  3 Payment / 4 Review) with a 25%-wide progress bar, single 640px column.
  Companion file: style.css (STILL NOT RECEIVED).
-->
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — MarketHub</title>
<link rel="stylesheet" href="style.css">
<style>
  .checkout-wrap{max-width:640px;margin:20px auto 0}
  .steps{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
  .steps .active{color:var(--brand-dark);font-weight:700}
  .progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:24px}
  .progress span{display:block;width:25%;height:100%;background:var(--brand)}
  .block{border:1px solid var(--line);border-radius:var(--radius-m);padding:16px;margin-bottom:16px}
  .block h3{font-size:14px;margin:0 0 10px}
  .addr-card{display:flex;justify-content:space-between;align-items:flex-start}
  .pay-option{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line-strong);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:13px}
  .pay-option.selected{border-color:var(--brand)}
</style>
</head>
<body>
<header class="site-header"><div class="container">
  <a href="index.html" class="logo"><span class="mkt">market</span><span class="hub">hub</span></a>
</div></header>

<main class="container">
  <div class="checkout-wrap">
    <div class="steps"><span class="active">1 Address</span><span>2 Shipping</span><span>3 Payment</span><span>4 Review</span></div>
    <div class="progress"><span></span></div>

    <div class="block">
      <h3>Shipping address</h3>
      <div class="addr-card">
        <div>
          <div style="font-size:13px;font-weight:600">Musiliu A. — 080 123 45678</div>
          <div style="font-size:12px;color:var(--muted);margin-top:3px">14 Adeola Street, Lagos, Nigeria</div>
        </div>
        <a href="#" style="font-size:12px;color:var(--brand-dark);font-weight:600">Change</a>
      </div>
    </div>

    <div class="block">
      <h3>Payment method</h3>
      <div class="pay-option selected"><span>💳 Visa ending 4417</span><span>●</span></div>
      <div class="pay-option"><span>🏦 Bank transfer</span><span>○</span></div>
    </div>

    <div class="block">
      <h3>Order total</h3>
      <div style="display:flex;justify-content:space-between;font-size:14px"><span>Subtotal + shipping + discounts</span><span style="font-weight:800">$533.98</span></div>
    </div>

    <a href="account.html" class="btn-primary" style="display:block;text-align:center;background:var(--brand);color:#fff;padding:14px;border-radius:999px;font-weight:700">Place Order</a>
  </div>
</main>

<footer class="site-footer"><div class="container"><div class="footer-bottom"><span>© 2026 MarketHub.</span><span>support@markethub.com</span></div></div></footer>
</body>
</html>
